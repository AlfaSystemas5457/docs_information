<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Odoo - Información de empleados y vehiculos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <section class="container py-5">
        <div class="text-center">
            <h1 class="fw-bold text-primary">Acceso simple a los documentos de los empleados y vehiculos registrados.
            </h1>
            <p class="lead">Administra mejor los diferentes documentos agregados.</p>
        </div>

        <div class="row justify-content-center my-4">
            <div class="col-md-8 text-center">
                <h2 class="fw-semibold text-info">Compatible con Odoo Community</h2>
            </div>
        </div>

        <div class="row justify-content-center my-4">
            <div class="col-md-6 text-center">
                <a href="https://github.com/AlfaSystemas5457/employee_docs_information" target="_blank"
                    class="btn btn-primary btn-lg">
                    <span class="fs-4">Ver en GitHub</span>
                </a>
            </div>
        </div>

        <div class="row justify-content-center my-5">
            <div class="col-md-8">
                <h2 class="fw-semibold text-dark">Acceso facil a los documentos</h2>
                <p>Se agrega un boton para acceder en los botones del módulo <strong>hr</strong> </p>
                <div class="text-center">
                    <img src="./assets/Botón de hr.png" alt="Botón de hr" class="img-fluid rounded shadow">
                </div>
            </div>
        </div>

        <div class="row justify-content-center my-5">
            <div class="col-md-8">
                <h2 class="fw-semibold text-dark">Así se muestran los docmuentos</h2>
                <div class="text-center">
                    <img src="./assets/Vista previa de documentos.png" alt="Vista previa de documentos"
                        class="img-fluid rounded shadow">
                </div>
            </div>
        </div>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
